[package]
name = "cmbr"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Membership facade of cvld: register, passkeys, enrolment and pins per community member"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cmbr.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
ed25519-dalek = "2.2"
cplc = { git = "https://git.corbet.ch/corbet-libs/cplc.git", branch = "v01" }
cgts = { git = "https://git.corbet.ch/corbet-libs/cgts.git", branch = "v01" }
cgrd = { git = "https://git.corbet.ch/corbet-foss/cgrd.git", branch = "v01", default-features = false }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt.git", branch = "v01" }
crgs = { git = "https://git.corbet.ch/corbet-foss/crgs.git", branch = "v01" }
ckyh = { git = "https://git.corbet.ch/corbet-foss/ckyh.git", branch = "v01" }
cnrl = { git = "https://git.corbet.ch/corbet-foss/cnrl.git", branch = "v01" }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns.git", branch = "v01" }
clbs = { git = "https://git.corbet.ch/corbet-foss/clbs.git", branch = "v01" }
crbk = { git = "https://git.corbet.ch/corbet-foss/crbk.git", branch = "v01" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }

[dev-dependencies]
passkey = "0.4"
async-trait = "0.1"
serde_cbor_2 = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3
