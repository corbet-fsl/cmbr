schema = 1
project = "cmbr"

[checks.verify]
kind = "commands"
fleet = true
commands = [
  ["python3", "-B", ".ci/test-resolve-dependencies.py"],
  ["python3", "-B", ".ci/test-passkey-controls.py"],
  ["cargo", "fmt", "--all", "--check"],
  ["node", "--test", ".github/check-pins.test.mjs"],
  ["bash", "-c", "set -euo pipefail\ncargo metadata --locked --format-version 1 > dependency-metadata.json"],
  ["node", ".github/check-pins.mjs", "dependency-metadata.json"],
  ["cargo", "clippy", "--locked", "--all-targets", "--", "-D", "warnings"],
  ["python3", "-B", ".ci/passkey-controls.py"],
  ["cargo", "test", "--locked", "--no-fail-fast"],
  ["ccid", "first-party"],
  ["node", "--test", ".github/test-auto-merge.mjs"],
  ["ccid", "coverage", "run"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["node", "--version"], ["python3", "--version"], ["pkg-config", "--version"], ["openssl", "version"]]
cache_env = ["PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock", "dependency-metadata.json"]

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["ccid:run-declared-checks"]
events = ["manual"]

# Retain the reviewed integration graph before a separate locked verification.
[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "linux"
checks = ["resolve-dependencies"]
workflow = "resolve-dependencies"
command = ["ccid:run-declared-checks"]
events = ["manual"]

[check_shell]

[security]
dependencies = "cargo-deny"

[coverage]
llvm_cov = ["--workspace", "--all-features", "--branch", "--no-cfg-coverage", "--no-cfg-coverage-nightly", "--ignore-filename-regex", "(/tests/|/tests\\.rs$)"]
report = ["--branch", "--ignore-filename-regex", "(/tests/|/tests\\.rs$)"]
artifacts = true

[runtime]
tools = ["nodejs", "python3", "cargo-deny", "cargo-llvm-cov"]

[toolchain]
nightly = true

